name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Spotless compares against the event's base commit, which is absent
          # from GitHub's default shallow checkout.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve comparison base
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Protect Detekt baselines
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_detekt_baseline.py'
          BASELINE_BASE_DIR="$(mktemp -d)"
          for BASELINE in \
            app/detekt-baseline-debug.xml \
            app/detekt-baseline-debugUnitTest.xml
          do
            BASELINE_AT_BASE="$BASELINE_BASE_DIR/$(basename "$BASELINE")"
            if git cat-file -e "${BASE_SHA}:${BASELINE}" 2>/dev/null; then
              git show "${BASE_SHA}:${BASELINE}" > "$BASELINE_AT_BASE"
            fi
            python3 scripts/check_detekt_baseline.py "$BASELINE_AT_BASE" "$BASELINE"
          done

      - name: Formatting
        run: ./gradlew spotlessCheck -PspotlessRatchetFrom="$BASE_SHA"

      - name: Static analysis
        run: ./gradlew :app:detektDebug :app:detektDebugUnitTest

      - name: Unit tests and coverage
        run: ./gradlew test :app:koverVerifyDebug

      - name: Lint
        run: ./gradlew :app:lint

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
